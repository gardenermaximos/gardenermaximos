<svg width="900" height="10" viewBox="0 0 900 10" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFA53C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="5" x2="900" y2="5" stroke="#331A00" stroke-width="1"/>
  <rect x="-220" y="0" width="220" height="10" fill="url(#sweep)">
    <animate attributeName="x" from="-220" to="900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
