name: Generate Snake Animation

on:
  schedule:
    # Executa automaticamente a cada 24 horas
    - cron: "0 0 * * *"
  
  # Permite disparar o script manualmente pela aba Actions
  workflow_dispatch:
  
  # Executa sempre que você atualizar o README
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera o SVG da cobrinha devorando o gráfico de contribuições
      - name: generate-github-user-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publica a imagem gerada em uma branch separada chamada "output"
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
